<html>
<head>



<title>BMR Calculator</title>

 <link rel="icon" href="favicon2.ico">
</head>
<body style="background-color: #e67e22; font-family: Arial; padding: 20px;">






<h2>BMR and Calorie CalculatorS</h2>

<form id="bmrForm">

System:
<select id="sys" onchange="changeSystem()">
<option value="metric">Metric</option>
<option value="imperial">Imperials </option>
</select>

<br><br>
Gender:
<select id="gender">
<option value="F">Female</option>
<option value="M">Male</option>
</select>

<br><br>
Age: <input type="number" id="age" min="1" max="120" required>

                    <br><br>
        Height <span id="hUnit">(cm)</span>: <input type="number" id="height" min="1" required>

<br><br>
Weight <span id="wUnit">(kg)</span>: <input type="number" id="weight" min="1" required>

<br><br>
Activity Level:
<br>
<input type="radio" name="activity" value="1.2" required> Sedentary (little or no exercise)
<br>
<input type="radio" name="activity" value="1.375"> Lightly active (1-3 days per week)
<br>






<input type="radio" name="activity" value="1.55"> Moderately active (3-5 days per week)
<br>
<input type="radio" name="activity" value="1.725"> Very active (6-7 days per week)
<br>
<input type="radio" name="activity" value="1.9"> Super active (physical job or 2x training)

<br><br>
<input type="button" value="Calculate BMR" onclick="calculateBMR()">

</form>

<br>
<div id="resultBox" style="font-weight: bold; font-size: 18px;"></div>

<script src="assignment2.js"></script>
</body>
</html>
